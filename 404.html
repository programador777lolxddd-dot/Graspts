<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f1e">
  <title>404 — Ruta perdida | Graspts</title>
  <style>
    :root{color-scheme:dark;--bg:#071512;--panel:#0e2420;--text:#e8fff7;--muted:#9bb9af;--green:#1de9b6;--blue:#42a5f5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#103d35 0%,var(--bg) 60%);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,7vw,56px);text-align:center;border:1px solid #24483f;border-radius:28px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 24px 80px #0006}
    .mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 24px;border-radius:18px;background:linear-gradient(135deg,var(--green),var(--blue));color:#05231d;font-weight:900;font-size:28px}
    .code{font-size:clamp(4rem,18vw,7rem);line-height:1;font-weight:900;letter-spacing:-.08em;background:linear-gradient(120deg,var(--green),var(--blue));background-clip:text;color:transparent}
    h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:18px 0 8px}
    p{color:var(--muted);margin:0 auto 28px;max-width:38ch}
    a{display:inline-block;padding:12px 20px;border-radius:13px;background:linear-gradient(120deg,var(--green),var(--blue));color:#05231d;text-decoration:none;font-weight:800}
    a:focus-visible{outline:3px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G</div>
    <div class="code">404</div>
    <h1>Esta ruta se perdió.</h1>
    <p>La página que buscas no está por aquí. Volvamos a donde tus gastos están bajo control.</p>
    <a href="/">Volver a Graspts</a>
  </main>
</body>
</html>
